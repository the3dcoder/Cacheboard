# Runs identically on this Windows machine and on the home lab box.
#
#   cd server
#   cp .env.example .env      # then fill in DASHBOARD_TOKEN at minimum
#   docker compose up -d
#
# Then open http://localhost:8787 — the dashboard is served by this same
# container, so the page and the API share an origin and no CORS setup is
# needed for the default case.

services:
  dashboard:
    build: .
    container_name: cacheboard
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    # Resolve through public DNS rather than inheriting the host's resolver.
    # Observed on 2026-07-28: the LAN router was the machine's only configured
    # nameserver, stopped answering on udp/53, and every outbound lookup in the
    # container failed with ENOTFOUND — cards showed a fetch error while the
    # internet itself was fine. Overriding here keeps the backend working
    # through a flaky router; remove it if you need to resolve LAN hostnames.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Mount the dashboard file by file rather than the whole folder.
      # Mounting ../ would put server/.env inside the web root — the server
      # refuses to serve dotfiles anyway, but the mount shouldn't expose it
      # in the first place.
      - ../index.html:/dashboard/index.html:ro
      - ../README.md:/dashboard/README.md:ro
      - ../NOTES.md:/dashboard/NOTES.md:ro
      - ../ROADMAP.md:/dashboard/ROADMAP.md:ro
      # Local Claude Code transcripts, for the LLM-usage cards.
      # READ-ONLY on purpose: the server only ever parses timestamps, model
      # names and token counters out of these, and never returns message
      # content. Comment this out if you don't want the container to see them.
      - ${CLAUDE_PROJECTS_HOST_DIR:-./.no-transcripts}:/transcripts:ro
      # Claude OAuth credentials, for the plan-limit card only.
      # READ-ONLY. The server extracts one access token, uses it for a single
      # outbound call to Anthropic's usage endpoint, and returns integers —
      # the token is never logged, cached or sent to the browser.
      # Comment this out to disable the plan-limit card entirely.
      - ${CLAUDE_CREDENTIALS_HOST_FILE:-./.no-creds}:/creds/.credentials.json:ro
      # Claude profile credentials, one folder per subscription. READ-ONLY:
      # the server reads one session token per account and returns integers.
      - ${CLAUDE_PROFILES_HOST_DIR:-./.no-profiles}:/profiles:ro
      # Rotated OAuth refresh tokens survive restarts here.
      - cacheboard-state:/data

volumes:
  cacheboard-state:
